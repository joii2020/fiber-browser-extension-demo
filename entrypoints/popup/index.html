<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiber WASM Demo</title>
  </head>
  <body>
    <section id="fiber-status-card" class="status-card" data-state="starting" aria-live="polite">
      <div class="status-card__header">
        <span id="status-dot" class="status-dot" aria-label="Starting"></span>
        <button
          id="status-refresh-button"
          class="status-refresh-button"
          type="button"
          aria-label="Refresh node info"
          title="Refresh node info"
          disabled
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 0 1-15.4 6.4" />
            <path d="M3 12A9 9 0 0 1 18.4 5.6" />
            <path d="M18 2v4h-4" />
            <path d="M6 22v-4h4" />
          </svg>
        </button>
        <span id="status-label" class="status-label">Starting</span>
      </div>
      <div id="node-name" class="node-name">Fiber</div>
      <div id="node-pubkey" class="node-pubkey">Initializing offscreen runtime</div>
      <div class="status-grid">
        <div>
          <span>Peers</span>
          <strong id="peer-count">-</strong>
        </div>
        <div>
          <span>Channels</span>
          <strong id="channel-count">-</strong>
        </div>
      </div>
    </section>
    <form id="peer-connect-form" class="peer-connect" autocomplete="off">
      <input
        id="peer-address-input"
        class="peer-connect__input"
        name="peer-address"
        type="text"
        required
        placeholder="Fiber node address"
        aria-label="Fiber node address"
      />
      <button id="peer-connect-button" class="peer-connect__button" type="submit" disabled>
        Connect
      </button>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
